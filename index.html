<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#CC2936" />
    <title>KojihTrack</title>
    <style>
      * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
      input, select, textarea { font-size: 16px !important; transform: translateZ(0); }
      body { overflow: hidden; position: fixed; width: 100%; height: 100%; margin: 0; padding: 0; background: #f2f2f2; }
      body.dark { background: #0f0f0f; }
      body.dark .card-surface { background: #1a1a1a !important; border-color: #333333 !important; }
      body.dark .surface-alt { background: #252525 !important; }
      body.dark .text-main { color: #f0f0f0 !important; }
      body.dark .text-muted { color: #aaaaaa !important; }
      body.dark .nav-bar { background: rgba(15,15,15,0.97) !important; border-color: #333333 !important; }
      body.dark .header-bar { background: rgba(15,15,15,0.98) !important; border-color: #333333 !important; }
      #root { overflow-y: auto; height: 100dvh; width: 100vw; -webkit-overflow-scrolling: touch; overscroll-behavior: none; padding-bottom: env(safe-area-inset-bottom); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
